<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXFLOR - Exposición 3D | Floristería El Trigal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b061a;
            color: #ffffff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Fondo 3D Canvas */
        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Cabecera */
        header {
            background: linear-gradient(90deg, #1a0b2e 0%, #2e0f45 100%);
            border-bottom: 2px solid #9333ea;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.3);
        }

        .logo-area h1 {
            font-size: 2.5rem;
            color: #c084fc;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
            letter-spacing: 2px;
        }

        .logo-area p {
            font-size: 1.1rem;
            color: #a78bfa;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            background-color: #3b82f6;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .fs-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
        }

        .fs-btn:hover {
            background: #9333ea;
            transform: scale(1.05);
        }

        /* Contenedor Principal / Diapositivas */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .slide-container {
            background: rgba(18, 10, 35, 0.9);
            border: 2px solid #7c3aed;
            border-radius: 20px;
            padding: 40px 60px;
            max-width: 1150px;
            width: 100%;
            box-shadow: 0 0 35px rgba(124, 58, 237, 0.4);
            backdrop-filter: blur(10px);
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-number {
            color: #38bdf8;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slide-title {
            font-size: 2.3rem;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .slide-text {
            font-size: 1.25rem;
            color: #cbd5e1;
            line-height: 1.7;
        }

        /* Controles de Navegación */
        footer {
            background: #0f0724;
            border-top: 1px solid #4c1d95;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .counter-indicator {
            font-size: 1.4rem;
            font-weight: bold;
            color: #c084fc;
        }
    </style>
    <!-- Three.js para efectos 3D de fondo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="canvas3d"></canvas>

    <header>
        <div class="logo-area">
            <h1>NEXFLOR</h1>
            <p>Floristería El Trigal - Exposición 3D</p>
        </div>
        <div class="header-right">
            <button class="fs-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
            <div class="badge">Grado 11</div>
        </div>
    </header>

    <main>
        <div class="slide-container" id="slideBox">
            <div class="slide-number" id="sNum">Diapositiva 1 de 15</div>
            <h2 class="slide-title" id="sTitle">Cargando...</h2>
            <p class="slide-text" id="sText">Espere un momento.</p>
        </div>
    </main>

    <footer>
        <button class="nav-btn" onclick="prevSlide()">Anterior</button>
        <div class="counter-indicator" id="indicator">1 / 15</div>
        <button class="nav-btn" onclick="nextSlide()">Siguiente</button>
    </footer>

    <script>
        // Array con 15 diapositivas con información profunda, técnica y detallada
        const slides = [
            {
                num: "Diapositiva 1 de 15",
                title: "Introducción al Proyecto NEXFLOR",
                text: "NEXFLOR es una solución tecnológica avanzada basada en un entorno web interactivo en 3D. Su propósito principal es abordar de manera integral los retos de seguridad ocupacional, salud ergonómica y optimización logística específicos de los procesos diarios que se llevan a cabo en las instalaciones de Floristería El Trigal."
            },
            {
                num: "Diapositiva 2 de 15",
                title: "Análisis del Entorno Operativo en El Trigal",
                text: "La floricultura exige un flujo constante y riguroso. El proyecto analiza detalladamente cada fase operativa: desde la recepción de tallos frescos en el área de poscosecha, pasando por las mesas de diseño y armado floral, hasta el empaque especializado y la preparación final para la distribución comercial."
            },
            {
                num: "Diapositiva 3 de 15",
                title: "Identificación de Riesgos Ergonómicos y Posturales",
                text: "Durante la jornada laboral, los operarios enfrentan factores de riesgo significativos debido a posturas de pie prolongadas, inclinaciones repetitivas sobre las mesas de trabajo y la manipulación continua de cargas pesadas, lo que incrementa el riesgo de fatiga muscular crónica y lesiones lumbares."
            },
            {
                num: "Diapositiva 4 de 15",
                title: "Objetivo General y Propósito del Software",
                text: "Desarrollar un recurso digital interactivo que funcione como una guía visual preventiva. Busca concientizar tanto al personal operativo como a los coordinadores sobre la importancia de adoptar posturas saludables y cumplir estrictamente los protocolos de seguridad industrial en el piso de trabajo."
            },
            {
                num: "Diapositiva 5 de 15",
                title: "Módulo de Verificación de Elementos de Protección (EPP)",
                text: "Implementación conceptual de un sistema de control enfocado en garantizar el uso obligatorio y correcto de los EPP fundamentales: guantes de carnaza o nitrilo para proteger contra espinas y cortes con herramientas, y gafas de seguridad para evitar salpicaduras accidentales de productos de conservación."
            },
            {
                num: "Diapositiva 6 de 15",
                title: "Higiene Postural y Adaptación de Estaciones",
                text: "Establecimiento de directrices ergonómicas orientadas a adecuar la altura de las mesas de trabajo en la floristería. Esto previene la flexión excesiva del cuello y de la columna vertebral, reduciendo drásticamente la tensión acumulada en la espalda alta y los hombros de los trabajadores."
            },
            {
                num: "Diapositiva 7 de 15",
                title: "Manipulación Segura de Cargas y Herramientas de Corte",
                text: "Capacitación visual sobre técnicas correctas para levantar canastillas y cajas sin comprometer la zona lumbar, además de pautas estrictas para el correcto almacenamiento, mantenimiento preventivo y agarre seguro de tijeras y cuchillos profesionales de corte."
            },
            {
                num: "Diapositiva 8 de 15",
                title: "Stack Tecnológico y Estándares de Desarrollo",
                text: "El proyecto fue construido utilizando tecnologías web robustas y modernas: marcado semántico en HTML5, hojas de estilos avanzadas en CSS3 para un diseño responsivo y atractivo, scripts en JavaScript para la lógica de navegación y Three.js para la renderización de gráficos tridimensionales."
            },
            {
                num: "Diapositiva 9 de 15",
                title: "Experiencia Gráfica Tridimensional en Tiempo Real",
                text: "Integración de geometría y animación 3D directamente en el navegador web. Esto permite generar una atmósfera visual inmersiva que capta la atención del público y demuestra el dominio técnico en programación sin requerir la instalación previa de software especializado."
            },
            {
                num: "Diapositiva 10 de 15",
                title: "Control de Versiones y Despliegue en la Nube",
                text: "Gestión rigurosa del código fuente mediante control de versiones en GitHub, complementada con un flujo de despliegue continuo automatizado en Vercel. Esto garantiza alta disponibilidad, estabilidad del sitio y un acceso inmediato a través de internet desde cualquier dispositivo."
            },
            {
                num: "Diapositiva 11 de 15",
                title: "Validación de Usabilidad en el Ámbito Real",
                text: "Evaluación enfocada en la facilidad de uso de la interfaz dentro del entorno de la floristería, asegurando que los operarios y líderes de proceso puedan interactuar con el contenido digital de forma intuitiva, fluida y sin barreras técnicas complejas."
            },
            {
                num: "Diapositiva 12 de 15",
                title: "Beneficios Organizacionales y de Salud Laboral",
                text: "La aplicación de estas directrices promueve una reducción notable en las dolencias físicas del personal, optimiza los tiempos muertos por fatiga y consolida una cultura preventiva sólida que mejora la productividad y el bienestar general dentro de la empresa."
            },
            {
                num: "Diapositiva 13 de 15",
                title: "Impacto Académico del Programa de Articulación",
                text: "Este desarrollo representa la culminación exitosa de las competencias técnicas en programación de software, logrando vincular de manera directa la informática aplicada con la solución de problemáticas reales del sector agroindustrial y comercial del municipio."
            },
            {
                num: "Diapositiva 14 de 15",
                title: "Proyecciones y Escalabilidad del Sistema",
                text: "Planes futuros para expandir las capacidades del software, incluyendo la posible integración de bases de datos para registros de control, auditorías de seguridad automatizadas y la adaptación de módulos para más sucursales y áreas de producción."
            },
            {
                num: "Diapositiva 15 de 15",
                title: "Conclusiones y Agradecimientos Finales",
                text: "Agradecimiento especial a la administración y equipo de Floristería El Trigal por facilitar el estudio del proceso, a los docentes orientadores por su guía técnica y a la familia por el respaldo constante durante el desarrollo de esta etapa formativa de grado 11."
            }
        ];

        let currentSlide = 0;

        function updateSlide() {
            document.getElementById('sNum').innerText = slides[currentSlide].num;
            document.getElementById('sTitle').innerText = slides[currentSlide].title;
            document.getElementById('sText').innerText = slides[currentSlide].text;
            document.getElementById('indicator').innerText = `${currentSlide + 1} / 15`;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlide();
            } else {
                currentSlide = 0;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            } else {
                currentSlide = slides.length - 1;
                updateSlide();
            }
        }

        // Función de pantalla completa
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error al intentar modo pantalla completa: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Inicializar la primera diapositiva al cargar
        updateSlide();

        // Fondo 3D con Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const geometries = [
            new THREE.IcosahedronGeometry(1.5, 0),
            new THREE.BoxGeometry(1.8, 1.8, 1.8),
            new THREE.OctahedronGeometry(1.6, 0)
        ];

        const shapes = [];
        for (let i = 0; i < 25; i++) {
            const geom = geometries[Math.floor(Math.random() * geometries.length)];
            const color = Math.random() > 0.5 ? 0x7c3aed : 0x3b82f6;
            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                wireframe: true,
                roughness: 0.4
            });
            const mesh = new THREE.Mesh(geom, material);
            
            mesh.position.set(
                (Math.random() - 0.5) * 35,
                (Math.random() - 0.5) * 35,
                (Math.random() - 0.5) * 35 - 10
            );
            
            scene.add(mesh);
            shapes.push(mesh);
        }

        const light = new THREE.PointLight(0xffffff, 2, 50);
        light.position.set(10, 10, 10);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x4a044e);
        scene.add(ambientLight);

        camera.position.z = 15;

        function animate() {
            requestAnimationFrame(animate);
            shapes.forEach(shape => {
                shape.rotation.x += 0.005;
                shape.rotation.y += 0.007;
            });
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
