<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXFLOR - Módulos Operativos | Floristería El Trigal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b061a;
            color: #ffffff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Fondo 3D Canvas */
        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Cabecera */
        header {
            background: linear-gradient(90deg, #1a0b2e 0%, #2e0f45 100%);
            border-bottom: 2px solid #9333ea;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.3);
        }

        .logo-area h1 {
            font-size: 2rem;
            color: #c084fc;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
            letter-spacing: 2px;
        }

        .logo-area p {
            font-size: 0.9rem;
            color: #a78bfa;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            background-color: #3b82f6;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .fs-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .fs-btn:hover {
            background: #9333ea;
            transform: scale(1.05);
        }

        /* Contenedor Principal / Diapositivas */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .slide-container {
            background: rgba(18, 10, 35, 0.95);
            border: 2px solid #7c3aed;
            border-radius: 20px;
            padding: 30px 40px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.5);
            backdrop-filter: blur(15px);
            min-height: 550px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            align-items: center;
        }

        .slide-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-number {
            color: #38bdf8;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .slide-title {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .slide-text {
            font-size: 1.2rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .slide-image-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #9333ea;
            background-color: rgba(0,0,0,0.3);
            max-height: 400px;
        }

        .slide-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Controles de Navegación */
        footer {
            background: #0f0724;
            border-top: 1px solid #4c1d95;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.5);
        }

        .counter-indicator {
            font-size: 1.2rem;
            font-weight: bold;
            color: #c084fc;
        }
    </style>
    <!-- Three.js para efectos 3D de fondo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="canvas3d"></canvas>

    <header>
        <div class="logo-area">
            <h1>NEXFLOR</h1>
            <p>Módulos Operativos - Floristería El Trigal</p>
        </div>
        <div class="header-right">
            <button class="fs-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
            <div class="badge">Grado 11</div>
        </div>
    </header>

    <main>
        <div class="slide-container" id="slideBox">
            <div class="slide-content">
                <div class="slide-number" id="sNum">Diapositiva 1 de 11</div>
                <h2 class="slide-title" id="sTitle">Cargando proyecto...</h2>
                <p class="slide-text" id="sText">Espere un momento.</p>
            </div>
            <div class="slide-image-wrapper" id="imgWrapper">
                <img src="" alt="" class="slide-image" id="sImg">
            </div>
        </div>
    </main>

    <footer>
        <button class="nav-btn" onclick="prevSlide()">Anterior</button>
        <div class="counter-indicator" id="indicator">1 / 11</div>
        <button class="nav-btn" onclick="nextSlide()">Siguiente</button>
    </footer>

    <script>
        const slides = [
            {
                title: "Introducción al Proyecto NEXFLOR",
                text: "NEXFLOR es una plataforma tecnológica creada desde cero para dar solución integral a las necesidades operativas de Floristería El Trigal, estructurándose en tres grandes pilares: ID, Posture y Academy.",
                img: "image_2.png"
            },
            {
                title: "Planteamiento del Problema en la Floricultura",
                text: "Identificamos los retos diarios en los cultivos de flores: la necesidad de optimizar el control de personal, prevenir lesiones físicas por malas posturas en largas jornadas y acelerar la capacitación de los operarios nuevos.",
                img: "image_3.png"
            },
            {
                title: "¿Para qué sirve NEXFLOR ID?",
                text: "NEXFLOR ID funciona como el sistema de registro y control de identidad para cada trabajador. Permite llevar una trazabilidad digital y segura del personal que labora en los distintos frentes y áreas de producción de la empresa.",
                img: "image_2.png"
            },
            {
                title: "Impacto Operativo de NEXFLOR ID",
                text: "Gracias a este módulo, la administración optimiza la asistencia, el seguimiento de roles y la identificación rápida de los operarios, mejorando la seguridad y el orden administrativo desde la entrada a la planta.",
                img: "image_5.png"
            },
            {
                title: "¿Para qué sirve NEXFLOR Posture?",
                text: "NEXFLOR Posture está diseñado para combatir el riesgo ergonómico. Su objetivo es educar, monitorear y concientizar a los colaboradores sobre la postura correcta de la espalda y la manipulación segura de cargas en las mesas de trabajo.",
                img: "image_4.png"
            },
            {
                title: "Beneficios de NEXFLOR Posture",
                text: "Mediante advertencias visuales y guías prácticas integradas en la plataforma, ayudamos a prevenir lesiones lumbares crónicas y fatiga muscular, protegiendo la salud y el bienestar de quienes realizan labores de armado y empaque.",
                img: "image_9.png"
            },
            {
                title: "¿Para qué sirve NEXFLOR Academy?",
                text: "NEXFLOR Academy es el centro de capacitación digital interactivo. Su propósito es centralizar la formación interna del personal en temas clave como el uso adecuado de Elementos de Protección Personal (EPP) y protocolos de seguridad.",
                img: "image_6.png"
            },
            {
                title: "Aprendizaje Efectivo en Academy",
                text: "A través de módulos sencillos y evaluaciones cortas, el sistema verifica que cada trabajador adquiera los conocimientos necesarios antes de iniciar sus actividades operativas, reduciendo riesgos de accidentes laborales.",
                img: ""
            },
            {
                title: "Validación en Campo con Floristería El Trigal",
                text: "El enfoque de los tres módulos fue validado directamente con las realidades del cultivo, asegurando que las herramientas tecnológicas respondan a necesidades reales de la agroindustria de la región.",
                img: ""
            },
            {
                title: "Resultados e Impacto General",
                text: "La implementación conjunta de ID, Posture y Academy logra una mayor eficiencia administrativa, un entorno de trabajo más seguro y un estándar superior en el cuidado y capacitación del talento humano de la empresa.",
                img: ""
            },
            {
                title: "Conclusiones y Agradecimientos",
                text: "NEXFLOR demuestra cómo la programación web puede transformar procesos reales de la agroindustria. Agradecemos a Floristería El Trigal y a nuestros docentes por el apoyo en este camino de formación técnica.",
                img: ""
            }
        ];

        let currentSlide = 0;
        const totalSlides = slides.length;
        const slideBox = document.getElementById('slideBox');
        const imgWrapper = document.getElementById('imgWrapper');

        function updateSlide() {
            const slide = slides[currentSlide];
            document.getElementById('sNum').innerText = `Diapositiva ${currentSlide + 1} de ${totalSlides}`;
            document.getElementById('sTitle').innerText = slide.title;
            document.getElementById('sText').innerText = slide.text;
            document.getElementById('indicator').innerText = `${currentSlide + 1} / ${totalSlides}`;

            const sImg = document.getElementById('sImg');
            if (slide.img && slide.img !== "") {
                sImg.src = slide.img;
                sImg.alt = slide.title;
                imgWrapper.style.display = 'flex';
            } else {
                sImg.src = "";
                sImg.alt = "";
                imgWrapper.style.display = 'none';
            }

            if (slide.img && slide.img !== "") {
                slideBox.style.gridTemplateColumns = '1fr 1.2fr';
            } else {
                slideBox.style.gridTemplateColumns = '1fr';
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSlide();
            } else {
                currentSlide = 0;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            } else {
                currentSlide = totalSlides - 1;
                updateSlide();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error al intentar modo pantalla completa: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        updateSlide();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const geometries = [
            new THREE.IcosahedronGeometry(1.5, 0),
            new THREE.BoxGeometry(1.8, 1.8, 1.8),
            new THREE.OctahedronGeometry(1.6, 0)
        ];

        const shapes = [];
        for (let i = 0; i < 25; i++) {
            const geom = geometries[Math.floor(Math.random() * geometries.length)];
            const color = Math.random() > 0.5 ? 0x7c3aed : 0x3b82f6;
            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                wireframe: true,
                roughness: 0.4
            });
            const mesh = new THREE.Mesh(geom, material);
            
            mesh.position.set(
                (Math.random() - 0.5) * 35,
                (Math.random() - 0.5) * 35,
                (Math.random() - 0.5) * 35 - 10
            );
            
            scene.add(mesh);
            shapes.push(mesh);
        }

        const light = new THREE.PointLight(0xffffff, 2, 50);
        light.position.set(10, 10, 10);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x4a044e);
        scene.add(ambientLight);

        camera.position.z = 15;

        function animate() {
            requestAnimationFrame(animate);
            shapes.forEach(shape => {
                shape.rotation.x += 0.005;
                shape.rotation.y += 0.007;
            });
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
